name: Bug Report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened vs what you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. agent-catalog register ...\n2. agent-catalog list\n3. see error"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "agent-catalog --version output"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack traces
      render: shell
