[project]
name = "agent-catalog-new"
version = "0.4.0"
description = "Declarative agent registry — catalog, discover, and diff agent capabilities across environments"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "Ervin", email = "ervin@nexusgate.tech"},
]
keywords = ["agents", "catalog", "registry", "ai-agents", "agent-management", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.15,<1",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0,<7",
    "rich>=13.0,<14",
    "deepdiff>=8.0,<9",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<1",
    "coverage[toml]>=7.6,<8",
    "mypy>=1.15",
]
mcp = [
    "mcp>=1.0,<2",
]

[project.scripts]
agent-catalog = "agent_catalog.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {include = ["agent_catalog*"]}}
package-data = {"agent_catalog" = ["py.typed"]}
license-files = []

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF", "SIM", "PERF"]
ignore = ["E501", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = []

[tool.coverage.run]
branch = true
source = ["agent_catalog"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = ["valid-type", "no-any-return"]
exclude = ["tests/"]
